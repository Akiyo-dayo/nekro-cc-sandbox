name: Release Docker Image

# Akiyo-dayo fork: build linux/amd64 only and push to ghcr.io/akiyo-dayo/nekro-cc-sandbox.
#
# Tag = <pyproject version, "+" replaced by "-">-cc<CLAUDE_CODE_VERSION from the Dockerfile>,
# e.g. 0.1.14-ak1-cc2.1.311. Tags are immutable: the job refuses to push a tag that already
# exists, and no "latest" tag is published. To release a new Claude Code, change the ARG in the
# Dockerfile (and bump the "+akN" suffix if anything else changed), then run this workflow
# manually or push the matching git tag v<image tag>.
#
# Only the built-in GITHUB_TOKEN is used; no Docker Hub or other secrets.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-cc*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/akiyo-dayo/nekro-cc-sandbox

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      # CI 忽略 I001：见 test.yml 中 lint 步骤说明
      - name: Lint
        run: uv run ruff check src/ tests/ --extend-ignore I001

      - name: Unit tests
        run: uv run pytest tests/unit -v --tb=short

      - name: Integration tests
        run: uv run pytest tests/integration -v --tb=short

  build:
    name: Build, smoke test and push (linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          arg() { sed -n "s/^ARG $1=\([0-9][0-9.]*\)\$/\1/p" Dockerfile; }
          debarg() { sed -n "s/^ARG $1=\([0-9][0-9A-Za-z.:+~-]*\)\$/\1/p" Dockerfile; }
          CC=$(arg CLAUDE_CODE_VERSION)
          AB=$(arg AGENT_BROWSER_VERSION)
          PW=$(arg PLAYWRIGHT_VERSION)
          SSHV=$(debarg OPENSSH_CLIENT_VERSION)
          RSYNCV=$(debarg RSYNC_VERSION)
          GITV=$(debarg GIT_VERSION)
          for v in CC AB PW SSHV RSYNCV GITV; do
            if [ -z "${!v}" ]; then
              echo "Cannot read pinned version ${v} from the Dockerfile ARGs" >&2
              exit 1
            fi
          done
          TAG="${VERSION//+/-}-cc${CC}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${TAG}" ]; then
            echo "git tag ${GITHUB_REF_NAME} does not match the computed image tag v${TAG}" >&2
            exit 1
          fi
          echo "Image: ${IMAGE}:${TAG}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "cc=${CC}"
            echo "ab=${AB}"
            echo "pw=${PW}"
            echo "sshv=${SSHV}"
            echo "rsyncv=${RSYNCV}"
            echo "gitv=${GITV}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "${IMAGE}:${{ steps.meta.outputs.tag }} already exists; tags are immutable, bump the version instead" >&2
            exit 1
          fi

      # No build cache on purpose: releases are rare, and a fresh build picks up base-image
      # security updates. Everything that matters for behaviour is pinned in the Dockerfile.
      - name: Build (load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          CC: ${{ steps.meta.outputs.cc }}
          AB: ${{ steps.meta.outputs.ab }}
          PW: ${{ steps.meta.outputs.pw }}
          SSHV: ${{ steps.meta.outputs.sshv }}
          RSYNCV: ${{ steps.meta.outputs.rsyncv }}
          GITV: ${{ steps.meta.outputs.gitv }}
        # pipefail is on: never pipe into an early-exiting reader (head, grep -q), the writer would
        # die of SIGPIPE (exit 141). Capture output first and match with here-strings instead.
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 7021:7021 -e INTERNAL_API_TOKEN=smoke "${IMAGE}:${TAG}"
          trap 'docker logs smoke 2>&1 | tail -n 50; docker rm -f smoke >/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7021/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:7021/health
          echo
          STATUS=$(curl -fsS -H "Authorization: Bearer smoke" http://localhost:7021/api/v1/status)
          echo "${STATUS}"
          # the service probes `claude --version` at startup: "<version> (Claude Code)"
          echo "${STATUS}" | jq -e --arg cc "${CC}" '.claude_version | startswith($cc + " ")' >/dev/null
          grep -q '^v22\.' <<<"$(docker exec smoke node --version)"
          docker exec smoke sh -c 'test "${DISABLE_AUTOUPDATER}" = 1'
          GLOBALS=$(docker exec smoke npm ls -g --depth=0)
          echo "${GLOBALS}"
          grep -qF "@anthropic-ai/claude-code@${CC}" <<<"${GLOBALS}"
          grep -qF "agent-browser@${AB}" <<<"${GLOBALS}"
          grep -qF "playwright@${PW}" <<<"${GLOBALS}"

          # Debian packages at the pinned versions
          for pair in "openssh-client=${SSHV}" "rsync=${RSYNCV}" "git=${GITV}"; do
            pkg="${pair%%=*}"; want="${pair#*=}"
            got=$(docker exec smoke dpkg-query -W -f='${Version}' "${pkg}")
            echo "${pkg}: ${got}"
            test "${got}" = "${want}"
          done
          docker exec smoke ssh -V
          docker exec smoke sh -c 'rsync --version | head -n 1'
          docker exec smoke git --version

          # SSH client config hook: /etc/ssh/ssh_config.d/50-nekro.conf includes
          # /home/appuser/.claude/nk-ssh/config. Everything below runs as appuser, like Claude Code.
          docker exec smoke id appuser
          docker exec smoke cat /etc/ssh/ssh_config.d/50-nekro.conf
          # (1) include target missing: ssh -G must succeed with nothing on stderr
          docker exec -u appuser smoke test ! -e /home/appuser/.claude/nk-ssh/config
          docker exec -u appuser smoke ssh -G nk-any >/dev/null 2>/tmp/ssh-missing.err
          cat /tmp/ssh-missing.err
          test ! -s /tmp/ssh-missing.err
          VERBOSE=$(docker exec -u appuser smoke ssh -vvv -G nk-any 2>&1 >/dev/null || true)
          grep -E '50-nekro|nk-ssh' <<<"${VERBOSE}" || true
          # (2) include target present (appuser-owned, 0600): its Host block is applied
          docker exec -u appuser smoke sh -c 'mkdir -p ~/.claude/nk-ssh && printf "Host nk-probe\n  HostName 192.0.2.10\n  User nkprobe\n" > ~/.claude/nk-ssh/config && chmod 600 ~/.claude/nk-ssh/config'
          PROBE=$(docker exec -u appuser smoke ssh -G nk-probe)
          grep -qx 'hostname 192.0.2.10' <<<"${PROBE}"
          grep -qx 'user nkprobe' <<<"${PROBE}"
          # (3) informational, does not fail the build: other owners/modes a host-side writer may produce
          docker exec smoke sh -c 'chown root:root /home/appuser/.claude/nk-ssh/config && chmod 644 /home/appuser/.claude/nk-ssh/config'
          OUT=$(docker exec -u appuser smoke ssh -G nk-probe 2>&1 || true)
          echo "root:root 0644 ->"; grep -E '^hostname|Bad owner|error' <<<"${OUT}" || true
          docker exec smoke chmod 666 /home/appuser/.claude/nk-ssh/config
          OUT=$(docker exec -u appuser smoke ssh -G nk-probe 2>&1 || true)
          echo "root:root 0666 ->"; grep -E '^hostname|Bad owner|error' <<<"${OUT}" || true
          docker exec smoke rm -rf /home/appuser/.claude/nk-ssh

      - name: Push
        run: docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"

      - name: Summary
        run: |
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${{ steps.meta.outputs.tag }}" || echo "(see push log)")
          {
            echo "### Published"
            echo ""
            echo "- Image: \`${IMAGE}:${{ steps.meta.outputs.tag }}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Claude Code: \`${{ steps.meta.outputs.cc }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker Logout
        if: always()
        run: docker logout ghcr.io
