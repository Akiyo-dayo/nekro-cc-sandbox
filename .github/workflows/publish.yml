name: Release Docker Image

# Akiyo-dayo fork: build linux/amd64 only and push to ghcr.io/akiyo-dayo/nekro-cc-sandbox.
#
# Tag = <pyproject version, "+" replaced by "-">-cc<CLAUDE_CODE_VERSION from the Dockerfile>,
# e.g. 0.1.14-ak1-cc2.1.311. Tags are immutable: the job refuses to push a tag that already
# exists, and no "latest" tag is published. To release a new Claude Code, change the ARG in the
# Dockerfile (and bump the "+akN" suffix if anything else changed), then run this workflow
# manually or push the matching git tag v<image tag>.
#
# Only the built-in GITHUB_TOKEN is used; no Docker Hub or other secrets.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-cc*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/akiyo-dayo/nekro-cc-sandbox

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      # CI 忽略 I001：见 test.yml 中 lint 步骤说明
      - name: Lint
        run: uv run ruff check src/ tests/ --extend-ignore I001

      - name: Unit tests
        run: uv run pytest tests/unit -v --tb=short

      - name: Integration tests
        run: uv run pytest tests/integration -v --tb=short

  build:
    name: Build, smoke test and push (linux/amd64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          arg() { sed -n "s/^ARG $1=\([0-9][0-9.]*\)\$/\1/p" Dockerfile; }
          debarg() { sed -n "s/^ARG $1=\([0-9][0-9A-Za-z.:+~-]*\)\$/\1/p" Dockerfile; }
          CC=$(arg CLAUDE_CODE_VERSION)
          AB=$(arg AGENT_BROWSER_VERSION)
          PW=$(arg PLAYWRIGHT_VERSION)
          SSHV=$(debarg OPENSSH_CLIENT_VERSION)
          RSYNCV=$(debarg RSYNC_VERSION)
          GITV=$(debarg GIT_VERSION)
          TINIV=$(debarg TINI_VERSION)
          for v in CC AB PW SSHV RSYNCV GITV TINIV; do
            if [ -z "${!v}" ]; then
              echo "Cannot read pinned version ${v} from the Dockerfile ARGs" >&2
              exit 1
            fi
          done
          TAG="${VERSION//+/-}-cc${CC}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${TAG}" ]; then
            echo "git tag ${GITHUB_REF_NAME} does not match the computed image tag v${TAG}" >&2
            exit 1
          fi
          echo "Image: ${IMAGE}:${TAG}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "cc=${CC}"
            echo "ab=${AB}"
            echo "pw=${PW}"
            echo "sshv=${SSHV}"
            echo "rsyncv=${RSYNCV}"
            echo "gitv=${GITV}"
            echo "tiniv=${TINIV}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "${IMAGE}:${{ steps.meta.outputs.tag }} already exists; tags are immutable, bump the version instead" >&2
            exit 1
          fi

      # No build cache on purpose: releases are rare, and a fresh build picks up base-image
      # security updates. Everything that matters for behaviour is pinned in the Dockerfile.
      - name: Build (load into local docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          CC: ${{ steps.meta.outputs.cc }}
          AB: ${{ steps.meta.outputs.ab }}
          PW: ${{ steps.meta.outputs.pw }}
          SSHV: ${{ steps.meta.outputs.sshv }}
          RSYNCV: ${{ steps.meta.outputs.rsyncv }}
          GITV: ${{ steps.meta.outputs.gitv }}
          TINIV: ${{ steps.meta.outputs.tiniv }}
        # pipefail is on: never pipe into an early-exiting reader (head, grep -q), the writer would
        # die of SIGPIPE (exit 141). Capture output first and match with here-strings instead.
        run: |
          set -euo pipefail
          # A stub Anthropic API (.github/smoke/fake_anthropic.py) on a private network lets a real
          # Claude Code run a task without any model or credentials (see the force-cancel check).
          docker network create smoke-net >/dev/null
          docker run -d --name fakeapi --network smoke-net --user 65534:65534 \
            -v "${GITHUB_WORKSPACE}/.github/smoke:/smoke:ro" --entrypoint python \
            "${IMAGE}:${TAG}" /smoke/fake_anthropic.py 8080
          docker run -d --name smoke --network smoke-net -p 7021:7021 \
            -e INTERNAL_API_TOKEN=smoke -e SKIP_PERMISSIONS=true \
            -e SETTINGS_PATH=/home/appuser/data/settings.json \
            -e CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 \
            "${IMAGE}:${TAG}"
          trap 'docker logs smoke 2>&1 | tail -n 80; echo "--- fakeapi"; docker logs fakeapi 2>&1 | tail -n 40; docker rm -f smoke fakeapi >/dev/null; docker network rm smoke-net >/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7021/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:7021/health
          echo
          STATUS=$(curl -fsS -H "Authorization: Bearer smoke" http://localhost:7021/api/v1/status)
          echo "${STATUS}"
          # the service probes `claude --version` at startup: "<version> (Claude Code)"
          echo "${STATUS}" | jq -e --arg cc "${CC}" '.claude_version | startswith($cc + " ")' >/dev/null
          grep -q '^v22\.' <<<"$(docker exec smoke node --version)"
          docker exec smoke sh -c 'test "${DISABLE_AUTOUPDATER}" = 1'
          GLOBALS=$(docker exec smoke npm ls -g --depth=0)
          echo "${GLOBALS}"
          grep -qF "@anthropic-ai/claude-code@${CC}" <<<"${GLOBALS}"
          grep -qF "agent-browser@${AB}" <<<"${GLOBALS}"
          grep -qF "playwright@${PW}" <<<"${GLOBALS}"

          # Debian packages at the pinned versions
          for pair in "openssh-client=${SSHV}" "rsync=${RSYNCV}" "git=${GITV}" "tini=${TINIV}"; do
            pkg="${pair%%=*}"; want="${pair#*=}"
            got=$(docker exec smoke dpkg-query -W -f='${Version}' "${pkg}")
            echo "${pkg}: ${got}"
            test "${got}" = "${want}"
          done
          docker exec smoke ssh -V
          docker exec smoke sh -c 'rsync --version | head -n 1'
          docker exec smoke git --version

          # SSH client config hook: /etc/ssh/ssh_config.d/50-nekro.conf includes
          # /home/appuser/.claude/nk-ssh/config. Everything below runs as appuser, like Claude Code.
          docker exec smoke id appuser
          docker exec smoke cat /etc/ssh/ssh_config.d/50-nekro.conf
          # (1) include target missing: ssh -G must succeed without errors. Without a terminal on
          # stdin (docker exec without -t, or Claude Code's Bash tool) ssh itself notes
          # "Pseudo-terminal will not be allocated because stdin is not a terminal." -- that line is
          # unrelated to the config and is the only stderr output allowed; with -T stderr must be empty.
          docker exec -u appuser smoke test ! -e /home/appuser/.claude/nk-ssh/config
          docker exec -u appuser smoke ssh -G nk-any >/dev/null 2>/tmp/ssh-missing.err
          cat /tmp/ssh-missing.err
          test -z "$(grep -v '^Pseudo-terminal will not be allocated because stdin is not a terminal' /tmp/ssh-missing.err || true)"
          docker exec -u appuser smoke ssh -T -G nk-any >/dev/null 2>/tmp/ssh-missing-T.err
          cat /tmp/ssh-missing-T.err
          test ! -s /tmp/ssh-missing-T.err
          VERBOSE=$(docker exec -u appuser smoke ssh -vvv -G nk-any 2>&1 >/dev/null || true)
          grep -E '50-nekro|nk-ssh' <<<"${VERBOSE}" || true
          # (2) include target present (appuser-owned, 0600): its Host block is applied
          docker exec -u appuser smoke sh -c 'mkdir -p ~/.claude/nk-ssh && printf "Host nk-probe\n  HostName 192.0.2.10\n  User nkprobe\n" > ~/.claude/nk-ssh/config && chmod 600 ~/.claude/nk-ssh/config'
          PROBE=$(docker exec -u appuser smoke ssh -G nk-probe)
          grep -qx 'hostname 192.0.2.10' <<<"${PROBE}"
          grep -qx 'user nkprobe' <<<"${PROBE}"
          # (3) informational, does not fail the build: other owners/modes a host-side writer may produce
          docker exec smoke sh -c 'chown root:root /home/appuser/.claude/nk-ssh/config && chmod 644 /home/appuser/.claude/nk-ssh/config'
          OUT=$(docker exec -u appuser smoke ssh -G nk-probe 2>&1 || true)
          echo "root:root 0644 ->"; grep -E '^hostname|Bad owner|error' <<<"${OUT}" || true
          docker exec smoke chmod 666 /home/appuser/.claude/nk-ssh/config
          OUT=$(docker exec -u appuser smoke ssh -G nk-probe 2>&1 || true)
          echo "root:root 0666 ->"; grep -E '^hostname|Bad owner|error' <<<"${OUT}" || true
          docker exec smoke rm -rf /home/appuser/.claude/nk-ssh

          # Force-cancel, then the very next message must be answered. When the cancel kills a
          # background Bash task, the next resume makes Claude Code first answer the "task stopped"
          # notification with a synthetic turn and an empty "success" result, and only then the new
          # prompt; the runtime has to read past the empty result. The stub reproduces that: the
          # SMOKE-INTERRUPT prompt makes the CLI start `sleep 300` in the background, the follow-up
          # model request is held open, and the task is cancelled while it hangs. A warm-up message
          # comes first so the cancelled turn is itself a resume of an existing session.
          docker exec -i -u appuser smoke sh -c 'mkdir -p ~/data && cat > ~/data/settings.json' <<'JSON'
          {"provider": "anthropic", "active_provider": "anthropic", "timeout_ms": 120000,
           "providers": {"anthropic": {"name": "stub", "base_url": "http://fakeapi:8080",
                                       "auth_token": "smoke-token", "model": "claude-sonnet-4-5"}}}
          JSON
          WARM=$(curl -fsS -m 300 -H "Authorization: Bearer smoke" -H "Content-Type: application/json" \
            -d '{"role": "user", "content": "SMOKE-WARMUP say ok", "workspace_id": "default"}' \
            http://localhost:7021/api/v1/message)
          echo "warm-up: ${WARM}"
          jq -e '.success == true and (.session_id | length > 0)' <<<"${WARM}" >/dev/null
          SID=$(jq -r '.session_id' <<<"${WARM}")
          curl -sS -m 300 -H "Authorization: Bearer smoke" -H "Content-Type: application/json" \
            -d '{"role": "user", "content": "SMOKE-INTERRUPT run the command", "workspace_id": "default"}' \
            http://localhost:7021/api/v1/message >/tmp/first.json 2>&1 &
          FIRST=$!
          # Cancel only while the follow-up request hangs and the tool result is in the transcript;
          # cancelling earlier leaves nothing half-done and the check would pass without testing.
          READY=no
          for i in $(seq 1 90); do
            if grep -qF -- '-> hold' <<<"$(docker logs fakeapi 2>&1)"; then
              N=$(docker exec -u appuser smoke sh -c "cat ~/.claude/projects/*/${SID}.jsonl 2>/dev/null | grep -c '\"tool_result\"' || true")
              if [ "${N:-0}" -gt 0 ]; then READY=yes; break; fi
            fi
            sleep 1
          done
          echo "model request in flight with the tool result persisted: ${READY}"
          test "${READY}" = yes
          CANCEL=$(curl -fsS -X DELETE -H "Authorization: Bearer smoke" \
            http://localhost:7021/api/v1/workspaces/default/queue/current)
          echo "cancel: ${CANCEL}"
          jq -e '.cancelled == true' <<<"${CANCEL}" >/dev/null
          wait "${FIRST}" || true
          echo "first: $(cat /tmp/first.json)"
          NEXT=$(curl -fsS -m 300 -H "Authorization: Bearer smoke" -H "Content-Type: application/json" \
            -d '{"role": "user", "content": "SMOKE-AFTER-CANCEL reply now", "workspace_id": "default"}' \
            http://localhost:7021/api/v1/message)
          echo "next: ${NEXT}"
          jq -e '.success == true and (.message | contains("after-cancel-ok"))' <<<"${NEXT}" >/dev/null
          # and the empty-result path really was exercised (otherwise this check proves nothing)
          SBLOG=$(docker logs smoke 2>&1)
          grep -E 'Empty result at the start of a resumed run|produced nothing|retrying' <<<"${SBLOG}" || true
          grep -qF 'Empty result at the start of a resumed run' <<<"${SBLOG}"

          # Claude Code's global config lives in the mounted ~/.claude (CLAUDE_CONFIG_DIR), not in $HOME
          docker exec smoke sh -c 'test "${CLAUDE_CONFIG_DIR}" = /home/appuser/.claude'
          docker exec smoke test -f /home/appuser/.claude/.claude.json
          docker exec smoke test ! -e /home/appuser/.claude.json

          # Zombie reaping: tini must be PID 1. Orphan a short-lived process the way a force-cancel
          # does (its parent dies first, so it is re-parented to PID 1), let it exit, and require
          # that no zombie is left behind.
          test "$(docker exec smoke cat /proc/1/comm)" = "tini"
          docker exec -u appuser smoke sh -c '(sleep 2 &); exit 0'
          sleep 5
          PS=$(docker exec smoke ps -eo pid,ppid,stat,comm)
          echo "${PS}"
          ZOMBIES=$(awk 'NR > 1 && $3 ~ /^Z/' <<<"${PS}")
          if [ -n "${ZOMBIES}" ]; then
            echo "zombie processes left behind:" >&2
            echo "${ZOMBIES}" >&2
            exit 1
          fi

          # Graceful stop (informational): tini forwards SIGTERM to the entrypoint
          START=$(date +%s)
          docker stop -t 20 smoke >/dev/null
          echo "docker stop took $(( $(date +%s) - START ))s"

      - name: Push
        run: docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"

      - name: Summary
        run: |
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${{ steps.meta.outputs.tag }}" || echo "(see push log)")
          {
            echo "### Published"
            echo ""
            echo "- Image: \`${IMAGE}:${{ steps.meta.outputs.tag }}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Claude Code: \`${{ steps.meta.outputs.cc }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Docker Logout
        if: always()
        run: docker logout ghcr.io
